# Stack local de MLOps. Tutorial completo: docs/docker.md
#
#   postgres  banco de metadados do MLflow (experimentos, runs, registry)
#   mlflow    servidor de tracking + proxy de artefatos  -> http://localhost:5000
#   trainer   executa o pipeline e registra no MLflow     (sob demanda: profile "train")
#   api       serve o modelo treinado                     -> http://localhost:8000/docs
#
# Primeira execução:
#   docker compose up -d mlflow
#   docker compose run --rm trainer
#   docker compose up -d api

name: diabetes-risk

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mlflow:
    build: docker/mlflow
    image: diabetes-risk/mlflow:3.17.2
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      # Artefatos (modelos, gráficos) passam pelo servidor: os clientes não
      # precisam de acesso direto ao storage. Troque por s3:// ou gs:// em produção.
      - --serve-artifacts
      - --artifacts-destination=/mlartifacts
      # Hosts aceitos no header Host (proteção contra DNS rebinding do MLflow 3).
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:${MLFLOW_PORT:-5000},127.0.0.1,127.0.0.1:${MLFLOW_PORT:-5000}
      - --workers=2
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  trainer:
    build:
      context: .
      target: trainer
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: diabetes-risk/trainer:${IMAGE_TAG:-latest}
    profiles: ["train"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./params.yaml:/app/params.yaml:ro
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: diabetes-risk/api:${IMAGE_TAG:-latest}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

volumes:
  postgres-data:
  mlflow-artifacts:
