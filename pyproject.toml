[project]
name = "diabetes-risk"
version = "0.1.0"
description = "Pipeline de ML reproduzível para predição de risco de diabetes (BRFSS 2015)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "moisesmember" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.14"]

[project.scripts]
diabetes-risk = "diabetes_risk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diabetes_risk"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PT", "RUF", "D"]
# N803/N806: `X` maiúsculo é convenção do scikit-learn. D401: regra não entende português.
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "D401", "D413", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "mlflow.*", "pandera.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: testes de integração (pipeline ponta a ponta, API, CLI)"]

[tool.coverage.run]
source = ["diabetes_risk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
